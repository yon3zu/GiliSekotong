# Nginx untuk GiliSekotong. __DOMAIN__, __ROOT__, __PHPV__ diganti oleh setup-ubuntu.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    root __ROOT__/public;
    index index.php;
    charset utf-8;

    # Unggahan foto/video galeri dan bukti transfer.
    client_max_body_size 40M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset hasil build dan unggahan: boleh di-cache lama oleh browser.
    location ~* ^/(build|images|storage)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.svg { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHPV__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Tolak file tersembunyi (.env, .git) dan file PHP lain selain index.php.
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
